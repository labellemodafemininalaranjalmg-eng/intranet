<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Intranet — Dashboard</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 24px;
    }

    header {
      background: white;
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    header h1 { font-size: 18px; color: #333; margin: 0; }

    .nav a { text-decoration: none; color: #4f46e5; font-size: 14px; margin-left: 16px; }

    button.sair {
      background: none;
      border: 1px solid #ddd;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #666;
    }

    /* BANNER DESTAQUE */
    .banner-card {
      background: linear-gradient(135deg, #7878f5, #7878f5);
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 24px;
      color: white;
    }
    .banner-tag {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    .banner-card h2 { font-size: 22px; margin: 0 0 8px; }
    .banner-card p { font-size: 14px; opacity: 0.9; margin: 0 0 12px; line-height: 1.6; }
    .banner-tags .tag {
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 20px;
      display: inline-block;
      margin: 2px;
    }

    /* CARDS */
    h2 { font-size: 16px; color: #444; margin-bottom: 16px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 { font-size: 15px; color: #333; margin: 0 0 8px; }

    .motivo {
      font-size: 12px;
      color: #4f46e5;
      background: #eef2ff;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 8px;
    }

    .vazio { color: #999; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <h1>🏫 Intranet</h1>
    <nav class="nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/disciplinas">Disciplinas</a>
      <a href="/noticias">Notícias</a>
      <a href="/documentacao">Documentação</a>
      <a href="/admin">Admin</a>
    </nav>
    <span id="nome-usuario"></span>
    <button class="sair" onclick="sair()">Sair</button>
  </header>

      <!-- BANNER DE DESTAQUE -->
  <div id="banner" style="display:none"></div>
  <div class="cards" id="cards">
    <p class="vazio">Carregando...</p>
  </div>


  <script>
    async function carregarDashboard() {
      const respUser = await fetch('/api/me', { credentials: 'include' });
      if (respUser.status === 401) { window.location.href = '/'; return; }
      const usuario = await respUser.json();
      document.getElementById('nome-usuario').textContent = usuario.nome;

      // Carrega destaque
      const respDest = await fetch('/api/noticias/destaque', { credentials: 'include' });
      const destaques = await respDest.json();
      const banner = document.getElementById('banner');

      if (destaques.length > 0) {
        const d = destaques[0];
        banner.style.display = 'block';
        banner.innerHTML = `
          <div class="banner-card">
            <div class="banner-tag">📌 Em destaque</div>
            <h2>${d.titulo}</h2>
            <p>${d.conteudo || ''}</p>
            <div class="banner-tags">
              ${(d.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          </div>
        `;
      }

      // Carrega recomendações
      const respRec = await fetch('/api/recomendacoes', { credentials: 'include' });
      const dados = await respRec.json();
      const cards = document.getElementById('cards');

      if (dados.noticias.length === 0) {
        cards.innerHTML = '<p class="vazio">Nenhuma notícia recomendada no momento.</p>';
        return;
      }

      cards.innerHTML = dados.noticias.map(n => `
        <div class="card">
          <h3>${n.titulo}</h3>
          <p style="font-size:13px;color:#666;margin:4px 0 8px">${n.conteudo || ''}</p>
          <span class="motivo">📎 ${n.motivo.join(', ')}</span>
        </div>
      `).join('');
    }

    async function sair() {
      await fetch('/api/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/';
    }

    carregarDashboard();
  </script>

</body>
</html>

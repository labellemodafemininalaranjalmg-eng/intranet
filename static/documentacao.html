<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Intranet — Documentação</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 24px; }

    header {
      background: white; padding: 16px 24px; border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    header h1 { font-size: 18px; color: #333; margin: 0; }
    .nav a { text-decoration: none; color: #4f46e5; font-size: 14px; margin-left: 16px; }
    button.sair {
      background: none; border: 1px solid #ddd; padding: 6px 14px;
      border-radius: 8px; cursor: pointer; font-size: 13px; color: #666;
    }

    .hero {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 12px; padding: 28px 32px; margin-bottom: 24px; color: white;
    }
    .hero h2 { font-size: 22px; margin: 0 0 6px; }
    .hero p { font-size: 14px; opacity: 0.85; margin: 0; }

    .pdf-container {
      background: white; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 85vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<header>
  <h1>🏫 Intranet</h1>
  <nav class="nav">
    <a href="/dashboard">Dashboard</a>
    <a href="/disciplinas">Disciplinas</a>
    <a href="/noticias">Notícias</a>
    <a href="/documentacao">Documentação</a>
  </nav>
  <button class="sair" onclick="sair()">Sair</button>
</header>

<div class="hero">
  <h2>📄 Documentação do Projeto</h2>
  <p>Descrição técnica e acadêmica da Intranet de Estudos.</p>
</div>

<div class="pdf-container">
  <iframe src="/static/intranet_documentacao.pdf"></iframe>
</div>

<script>
  async function sair() {
    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
    window.location.href = '/';
  }

  fetch('/api/me', { credentials: 'include' }).then(r => {
    if (r.status === 401) window.location.href = '/';
  });
</script>

</body>
</html>
